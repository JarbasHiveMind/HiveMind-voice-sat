name: Build Tests

on:
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

jobs:
  build:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@dev
    with:
      python_versions: '["3.10", "3.11", "3.12", "3.13"]'
      pre_install_pip: '"hivescope @ git+https://github.com/JarbasHiveMind/hivescope@fix/acl-resolve-user"'
      test_path: 'tests/'
