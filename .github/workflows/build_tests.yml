name: Build Tests

on:
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

jobs:
  build:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@dev
    with:
      python_versions: '["3.10", "3.11", "3.12", "3.13"]'
      # Pinned to the bus-client 1.x world: the satellite's ovos-audio /
      # ovos-dinkum-listener deps require ovos-bus-client<2.0.0, so core /
      # agent-plugin stay on their last 1.x-compatible alphas (their 2.x
      # successors require ovos-bus-client>=2.0.0a3 and would conflict).
      # hivescope 0.5.0a2 resolves on 1.x via hivemind-bus-client 0.9.1a1.
      pre_install_pip: '"hivescope==0.5.0a2" "hivemind-plugin-manager==0.6.0a1" "hivemind-ovos-agent-plugin==0.2.0a1" "hivemind-core==4.3.0a2"'
      test_path: 'tests/'
