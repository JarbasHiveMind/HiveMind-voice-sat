name: Code Coverage

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  coverage:
    uses: OpenVoiceOS/gh-automations/.github/workflows/coverage.yml@dev
    with:
      python_version: '3.11'
      coverage_source: 'hivemind_voice_satellite'
      test_path: 'tests/'
      # version policy is in pyproject (the `dev` extra <- requirements/dev.txt);
      # no pre_install pins here.
      test_extras: 'dev'
      min_coverage: 0
