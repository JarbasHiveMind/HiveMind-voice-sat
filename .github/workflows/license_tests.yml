name: License Check

on:
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

jobs:
  license_check:
    uses: OpenVoiceOS/gh-automations/.github/workflows/license-check.yml@dev
    with:
      # HiveMind packages are AGPL-3.0 by design; the gate catches unexpected
      # third-party copyleft, not the project's own license family.
      exclude_packages: '^(hivemind|hivescope|z85base91|poorman|ovos-bus-client|tqdm).*'
