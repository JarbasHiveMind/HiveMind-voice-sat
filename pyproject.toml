[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "HiveMind-voice-sat"
description = "HiveMind Voice Satellite — full on-device OVOS voice stack (STT/TTS/wake-word) over a HiveMind bus"
readme = "README.md"
authors = [{ name = "jarbasAI", email = "jarbasai@mailfence.com" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    # bus-client 2.x stack. ovos-audio>=1.2.3 and ovos-dinkum-listener>=0.7.2
    # lifted their ovos-bus-client cap to <3.0.0 (>=1.3.x), so the satellite
    # now resolves on ovos-bus-client 2.x alongside hivemind-bus-client 0.9.2a1
    # (which requires ovos-bus-client>=2.0.0a3). Prerelease floors per repo
    # policy: depend on a prerelease by pinning it as the minimum version so pip
    # resolves it without --pre.
    "hivemind-bus-client>=0.9.2a1,<1.0.0",
    "ovos-bus-client>=2.0.0a3,<3.0.0",
    "ovos-audio>=1.2.3a1,<2.0.0",
    "ovos-dinkum-listener>=0.7.2a1,<1.0.0",
    # ovos-plugin-manager lifted its ovos-bus-client cap to <3.0.0 in 2.4.1a1;
    # stable 2.2.0 still caps <2.0.0, so the floor must be this prerelease for
    # the 2.x stack to resolve (pinned as the minimum; pip needs no --pre).
    "ovos-plugin-manager>=2.4.1a1,<3.0.0",
    "ovos-vad-plugin-silero",
    "ovos-stt-plugin-server",
    "ovos-tts-plugin-server",
    "ovos-ww-plugin-vosk",
    "hivemind-ggwave",
    "click",
]

[project.optional-dependencies]
# Microphone backends (pick one for your platform).
linux = ["ovos-microphone-plugin-alsa"]
mac = ["ovos-microphone-plugin-sounddevice"]
# Lightweight unit/smoke deps run across the full python matrix in build_tests.
test = ["pytest"]
# Full HiveMind-side end-to-end stack: boots a real hivemind-core hub via
# hivescope's loopback WebSocket harness and drives the real satellite client.
# hivescope 0.5.2a1 floors hivemind-core / hivemind-bus-client onto the 2.x
# line, so these stay coherent with the runtime deps above. Prerelease floors
# (pinned as minimums; no --pre).
e2e = [
    "pytest",
    "pytest-timeout",
    "hivescope>=0.5.2a1",
    "hivemind-core>=4.6.2a1",
    "hivemind-ovos-agent-plugin>=0.3.0a1",
    "hivemind-plugin-manager>=0.6.0a1",
]

[project.urls]
Homepage = "https://github.com/JarbasHiveMind/HiveMind-voice-sat"

[project.scripts]
hivemind-voice-sat = "hivemind_voice_satellite.__main__:connect"

[tool.setuptools]
packages = ["hivemind_voice_satellite"]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "hivemind_voice_satellite.version.__version__" }
